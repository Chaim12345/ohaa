name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    outputs:
      apk_url: ${{ steps.tempsh.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        run: chmod +x ./gradlew ./build_apk.sh

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Build debug APK
        run: ./build_apk.sh --no-daemon

      - name: Upload APK to temp.sh
        id: tempsh
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          test -f "$APK_PATH"
          URL=$(curl -sS --retry 3 -F "file=@${APK_PATH}" https://temp.sh/upload | tr -d '\r\n')
          echo "APK uploaded to: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "## Debug APK"
            echo ""
            echo "Download (temp.sh, expires after a few days): $URL"
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" > apk-download-link.txt

      - name: Upload download link as artifact
        # The link file is tiny, so it fits even when the account's artifact storage quota is nearly exhausted.
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: apk-download-link
          path: apk-download-link.txt
          retention-days: 7

      - name: Upload APK artifact
        # Best-effort: fails without breaking the build when the artifact quota is hit.
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: openhands-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
