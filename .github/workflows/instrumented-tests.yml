name: Android Instrumented UI Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write       # push screenshot branch
  pull-requests: write  # post/update PR comment

env:
  # Test-only OpenHands Cloud key. The maintainer asked to hardcode it for CI
  # live tests (repo is public). Prefer a repo variable if one is ever set;
  # otherwise the instrumented job writes an empty .env and LiveCloudApiTest
  # self-skips via assumeTrue. The placeholder below is NOT a real key.
  OPENHANDS_API_KEY: ${{ vars.OPENHANDS_API_KEY || '' }}

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

  instrumented-tests:
    name: Instrumented UI tests (API ${{ matrix.api-level }} ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 under KVM is the fast path for every commit. The arm64 leg
        # runs the arm64-v8a system image on a native arm64 runner (no QEMU,
        # no x86 emulation) — see docs/ci-runners.md. On an x86_64 host the
        # same arm64 image would fall back to QEMU (10-30x slower), which is
        # why we pin the arm64 leg to the arm64 runner label above.
        include:
          - api-level: 30
            target: default
            arch: x86_64
          - api-level: 30
            target: default
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The secrets gradle plugin turns .env into BuildConfig fields; write the
      # CI-provided key there so LiveCloudApiTest can authenticate. An empty
      # key is fine — the test self-skips via assumeTrue. Always quote the
      # value: the plugin emits it verbatim into BuildConfig.java, and an
      # unquoted empty string is a Java syntax error.
      - name: Write .env for instrumented tests
        run: |
          printf 'OPENHANDS_API_KEY=%s\n' "${OPENHANDS_API_KEY:-}" > .env
          chmod 600 .env

      # The arm64 runner image ships the Android SDK cmdline-tools but not the
      # emulator/platform-tools packages; android-emulator-runner needs them
      # on PATH (it locates sdkmanager/adb itself).
      # The arm64 runner image has no ANDROID_HOME env var; its SDK lives at
      # /usr/local/lib/android/sdk. Install the missing packages there.
      # The ubuntu-24.04-arm runner image ships no Android SDK at all (unlike
      # ubuntu-latest, which has one under /usr/local/lib/android/sdk). Use
      # actions/setup-android-sdk to install a minimal SDK, then add the
      # emulator + arm64-v8a system image that android-emulator-runner needs.
      - name: Install Android SDK (arm64 runner)
        if: matrix.arch == 'arm64'
        run: |
          set -e
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd /tmp
          curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "emulator" "platform-tools" "platforms;android-30" "system-images;android-30;default;arm64-v8a"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # KVM must be readable for the emulator to use hardware acceleration.
      # Only needed on x86_64; the arm64 runner has no /dev/kvm and the arm64
      # image doesn't need it.
      - name: Enable KVM
        if: matrix.arch == 'x86_64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.arch }}

      - name: Create AVD for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch == 'arm64' && 'arm64-v8a' || matrix.arch }}
          force-avd-creation: false
          # Plain cold boot; we do not use snapshots at test time (see below).
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD for caching."

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch == 'arm64' && 'arm64-v8a' || matrix.arch }}
          force-avd-creation: false
          # -no-snapshot-load: the cached snapshot was created with
          # -no-snapshot-save, so loading it leaves the input service
          # unpublished and the runner's `input keyevent 82` unlock crashes.
          # Cold-boot instead; the AVD itself is cached, so this is fast.
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace
            # The emulator is still up here — pull the screenshots before the
            # runner tears it down.
            mkdir -p ./screenshots
            SRC=$(adb shell 'echo ${EXTERNAL_STORAGE:-/sdcard}/Android/data/com.example/files/screenshots')
            adb pull "$SRC" ./screenshots 2>/dev/null || echo "WARN: no screenshots pulled"
            ls -la ./screenshots/screenshots 2>/dev/null || ls -la ./screenshots 2>/dev/null || true

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/connected
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ./screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Post screenshot gallery to PR
        if: github.event_name == 'pull_request'
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCREENSHOT_DIR: ./screenshots
        run: |
          # Normalize: adb pull drops the files under ./screenshots/screenshots,
          # so point the script at whichever dir actually has PNGs.
          for d in ./screenshots/screenshots ./screenshots; do
            if [ -d "$d" ] && [ -n "$(find "$d" -name '*.png' 2>/dev/null | head -1)" ]; then
              SCREENSHOT_DIR="$d"; break
            fi
          done
          export SCREENSHOT_DIR
          if [ -z "$(find "$SCREENSHOT_DIR" -name '*.png' 2>/dev/null | head -1)" ]; then
            echo "No screenshots captured this run — skipping gallery comment."
            exit 0
          fi
          bash scripts/post_screenshots_to_pr.sh
