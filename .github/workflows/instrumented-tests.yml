name: Android Instrumented UI Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write       # push screenshot branch
  pull-requests: write  # post/update PR comment

env:
  # Test-only OpenHands Cloud key. The maintainer asked to hardcode it for CI
  # live tests (repo is public). Prefer a repo variable if one is ever set;
  # otherwise the instrumented job writes an empty .env and LiveCloudApiTest
  # self-skips via assumeTrue. The placeholder below is NOT a real key.
  OPENHANDS_API_KEY: ${{ vars.OPENHANDS_API_KEY || '' }}

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

  instrumented-tests:
    name: Instrumented UI tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [ 30 ]
        target: [ default ]
        arch: [ x86_64 ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The secrets gradle plugin turns .env into BuildConfig fields; write the
      # CI-provided key there so LiveCloudApiTest can authenticate. An empty
      # key is fine — the test self-skips via assumeTrue.
      - name: Write .env for instrumented tests
        run: |
          printf 'OPENHANDS_API_KEY=%s\n' "$OPENHANDS_API_KEY" > .env
          chmod 600 .env

      # KVM must be readable for the emulator to use hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.arch }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/connected
          if-no-files-found: ignore
          retention-days: 14

      - name: Pull screenshots from emulator
        if: always()
        run: |
          mkdir -p ./screenshots
          # The app writes PNGs to its external files dir on the emulator.
          adb pull /sdcard/Android/data/com.example/files/screenshots ./screenshots 2>/dev/null \
            || adb pull "$(adb shell 'echo $EXTERNAL_STORAGE')/Android/data/com.example/files/screenshots" ./screenshots 2>/dev/null \
            || echo "WARN: no screenshots pulled"
          ls -la ./screenshots/screenshots 2>/dev/null || ls -la ./screenshots 2>/dev/null || true

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ./screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Post screenshot gallery to PR
        if: github.event_name == 'pull_request' && always()
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCREENSHOT_DIR: ./screenshots/screenshots
        run: |
          if [ ! -d "$SCREENSHOT_DIR" ] || [ -z "$(find "$SCREENSHOT_DIR" -name '*.png' 2>/dev/null)" ]; then
            SCREENSHOT_DIR=./screenshots
          fi
          export SCREENSHOT_DIR
          bash scripts/post_screenshots_to_pr.sh
